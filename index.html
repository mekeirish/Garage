<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BUNDLECODE // PC</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0b0e1a, #060810);
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.15); }

        /* ===== NAV BAR ===== */
        .nav-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(16, 18, 32, 0.7);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
            flex-wrap: nowrap;
        }

        #tabs-container {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        /* ===== BOUTONS ONGLETS ===== */
        .btn-socket {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 8px 6px;
            min-width: 0;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
        }
        .btn-socket::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 10px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn-socket:hover::after { opacity: 1; }
        .btn-socket:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.14);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        @keyframes tapPulse {
            0% { transform: scale(1); }
            40% { transform: scale(0.94); }
            100% { transform: scale(1); }
        }
        .btn-socket.tapping {
            animation: tapPulse 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        .led {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #3c465a;
            transition: all 0.3s;
            flex-shrink: 0;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
        }
        .pwa-btn {
            background: none;
            border: none;
            color: #94a0b8;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            cursor: pointer;
            padding: 0;
            pointer-events: none;
            transition: color 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        /* ===== WORKSPACE ===== */
        .workspace {
            flex: 1;
            padding: 12px 16px;
            overflow: hidden;
            background: radial-gradient(ellipse at 30% 40%, rgba(40, 60, 120, 0.08), transparent 70%);
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }

        /* ===== ÉCRAN D'ACCUEIL ===== */
        .welcome {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
            z-index: 5;   /* au-dessus des cartes cachées */
        }
        .welcome.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Logo */
        .welcome-logo-wrap {
            position: relative;
            display: inline-block;
            animation: floatLogo 6s ease-in-out infinite;
        }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .welcome-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 520px;
            height: 520px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(139, 128, 200, 0.06) 0%, rgba(139, 128, 200, 0.02) 35%, transparent 65%);
            pointer-events: none;
            z-index: -1;
            animation: pulseGlow 6s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
        }

        .welcome-logo-svg {
            display: block;
            width: clamp(140px, 20vw, 240px);
            height: auto;
            filter: drop-shadow(0 0 24px rgba(139, 128, 200, 0.12));
        }

        .welcome-logo-svg .bracket-left { stroke: url(#gradLeft); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .welcome-logo-svg .bracket-right { stroke: url(#gradRight); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .welcome-logo-svg .slash { stroke: url(#gradSlash); stroke-width: 6; stroke-linecap: round; fill: none; filter: drop-shadow(0 0 8px rgba(200, 190, 240, 0.25)); }
        .welcome-logo-svg .tip { fill: #c8c0f0; opacity: 0.85; filter: drop-shadow(0 0 6px rgba(200, 192, 240, 0.6)); }
        .welcome-logo-svg .particle { fill: #c8c0f0; opacity: 0; animation: particleFade 4s ease-in-out infinite; }
        .welcome-logo-svg .particle:nth-child(2) { animation-delay: 0.5s; }
        .welcome-logo-svg .particle:nth-child(3) { animation-delay: 1.2s; }
        .welcome-logo-svg .particle:nth-child(4) { animation-delay: 2s; }
        .welcome-logo-svg .particle:nth-child(5) { animation-delay: 2.8s; }
        @keyframes particleFade {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.55; }
        }

        .welcome-signature {
            position: absolute;
            bottom: 28px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #566582;
        }
        .welcome-signature::before,
        .welcome-signature::after {
            content: '';
            display: inline-block;
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #3c465a, transparent);
            vertical-align: middle;
            margin: 0 14px;
        }
        .welcome-signature span {
            background: linear-gradient(135deg, #a0a0d0, #80b8d0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-weight: 700;
        }

        /* ===== CONTENEUR DES CARTES ===== */
        .cards-container {
            flex: 1;
            position: relative;
            min-height: 0;
            z-index: 1;   /* sous le welcome */
        }

        .pwa-single {
            position: absolute;
            inset: 0;
            display: none;   /* ← clé du fix : display none par défaut */
            flex-direction: column;
            background: rgba(8, 10, 22, 0.7);
            backdrop-filter: blur(12px) saturate(1.2);
            -webkit-backdrop-filter: blur(12px) saturate(1.2);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.02);
            overflow: hidden;
            min-height: 0;
            opacity: 0;
            transform: scale(0.98) translateY(6px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .pwa-single.visible {
            display: flex;   /* ← affiché */
            opacity: 1;
            transform: scale(1) translateY(0);
            z-index: 2;
        }
        .pwa-single.hidden-card {
            display: none;   /* ← vraiment caché */
        }

        .pwa-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            min-height: 42px;
        }
        .pwa-card-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            overflow: hidden;
        }
        .pwa-card-title .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .pwa-card-url {
            font-size: 10px;
            color: #4a5a6e;
            font-family: 'Courier New', monospace;
            margin-left: 8px;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pwa-card-reload {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            color: #6a7a8e;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 4px 10px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .pwa-card-reload:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.14);
            color: #fff;
        }

        .pwa-card-body {
            flex: 1;
            position: relative;
            background: #060810;
            overflow: hidden;
            min-height: 0;
        }

        .pwa-card-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #060810;
            display: block;
            scrollbar-width: none;
            -ms-overflow-style: none;
            overflow: auto;
        }
        .pwa-card-body iframe::-webkit-scrollbar { display: none; width: 0; height: 0; }

        .pwa-loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #060810;
            z-index: 2;
            transition: opacity 0.3s;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .pwa-loader.hidden { opacity: 0; pointer-events: none; }
        .pwa-loader .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .pwa-error {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #060810;
            z-index: 3;
            padding: 20px;
            text-align: center;
        }
        .pwa-error .err-icon { font-size: 40px; margin-bottom: 4px; }
        .pwa-error .err-title {
            font-size: 14px;
            font-weight: 700;
            color: #ff6b6b;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .pwa-error .err-msg {
            font-size: 12px;
            color: #6a7a8e;
            line-height: 1.5;
            max-width: 320px;
        }
        .pwa-error .err-url {
            font-size: 11px;
            color: #4a5a6e;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 4px;
            max-width: 100%;
        }
        .pwa-error .err-btn {
            margin-top: 8px;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.5px;
            border: 1px solid;
            background: transparent;
        }
        .pwa-error .err-btn:hover { filter: brightness(1.3); }

        @media (max-width: 768px) {
            .workspace { padding: 8px; }
            .nav-bar { padding: 8px; gap: 6px; }
            .btn-socket { padding: 6px 4px; }
            .pwa-btn { font-size: 9px; letter-spacing: 0; }
            .pwa-card-url { display: none; }
            .welcome-signature { font-size: 10px; letter-spacing: 3px; }
            .welcome-signature::before,
            .welcome-signature::after { width: 20px; margin: 0 8px; }
        }
    </style>

<body>

    <nav class="nav-bar">
        <div id="tabs-container"></div>

    <main class="workspace">
        <!-- Écran d'accueil -->
        <div class="welcome visible" id="welcome">
            <div class="welcome-logo-wrap">
                <div class="welcome-glow"></div>
                <svg class="welcome-logo-svg" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="gradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#b0a8d8"/>

                            <stop offset="100%" stop-color="#7fa8c4"/>
                        </linearGradient>
                        <linearGradient id="gradSlash" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#b8b0dc"/>
                            <stop offset="50%" stop-color="#a8a8cc"/>
                            <stop offset="100%" stop-color="#a0b8cc"/>

                    </defs>

                    <path class="bracket-left" d="M 62 20 L 22 60 L 62 100"/>
                    <path class="bracket-right" d="M 138 20 L 178 60 L 138 100"/>

                    <circle class="particle" cx="100" cy="10" r="1.8"/>

                </svg>
            </div>
            <div class="welcome-signature">Laiche <span>Brahim</span> 2026</div>

        <!-- Conteneur des cartes PWA -->
        <div class="cards-container" id="cards-container"></div>

    <script>
        // ================================================================
        //  AUDIO + VIBRATION
        // ================================================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function createWhiteNoiseBuffer(duration) {
            const sampleRate = audioCtx.sampleRate;
            const bufferSize = Math.floor(sampleRate * duration);
            const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.6;
            return buffer;
        }

        function playClickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = createWhiteNoiseBuffer(0.04);
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.09, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 2400;
            filter.Q.value = 2;
            noiseSource.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noiseSource.start(now);
            noiseSource.stop(now + 0.04);

            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1400, now);
            osc.frequency.exponentialRampToValueAtTime(700, now + 0.05);
            const oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(0.06, now);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.05);
        }

        function playOpenSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(560, now + 0.1);
            const oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(0.08, now);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.12);
        }

        function playCloseSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(560, now);
            osc.frequency.exponentialRampToValueAtTime(280, now + 0.1);
            const oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(0.08, now);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.12);
        }

        function vibrate(pattern = 12) {
            if ('vibrate' in navigator) {
                try { navigator.vibrate(pattern); } catch (e) {}
            }
        }

        // ================================================================
        //  🔧 ONGLETS FIXES
        // ================================================================
        const pwaList = [
            {
                id: 'pwa-1',
                name: 'Master',
                url: 'https://mekeirish.github.io/Bmastercode/',
                color: '#a78bfa',
                colorDim: 'rgba(167, 139, 250, 0.5)',
                colorBg: 'rgba(167, 139, 250, 0.14)',
                colorBgSoft: 'rgba(167, 139, 250, 0.06)'
            },
            {
                id: 'pwa-2',
                name: 'Sniper',
                url: 'https://mekeirish.github.io/Bsnipercode/',
                color: '#22d3ee',
                colorDim: 'rgba(34, 211, 238, 0.5)',
                colorBg: 'rgba(34, 211, 238, 0.14)',
                colorBgSoft: 'rgba(34, 211, 238, 0.06)'
            },
            {
                id: 'pwa-3',
                name: 'Lab',
                url: 'https://mekeirish.github.io/Blabcode/',
                color: '#fb923c',
                colorDim: 'rgba(251, 146, 60, 0.5)',
                colorBg: 'rgba(251, 146, 60, 0.14)',
                colorBgSoft: 'rgba(251, 146, 60, 0.06)'
            },
            {
                id: 'pwa-4',
                name: 'Hub',
                url: 'https://mekeirish.github.io/Bhubcode/',
                color: '#4ade80',
                colorDim: 'rgba(74, 222, 128, 0.5)',
                colorBg: 'rgba(74, 222, 128, 0.14)',
                colorBgSoft: 'rgba(74, 222, 128, 0.06)'
            }
        ];

        // ================================================================
        //  ÉTAT
        // ================================================================
        const ACTIVE_KEY = 'activePwa_pc_v6';

        let activePwaId = null;
        const loadedPwas = new Set();

        function saveActive() {
            if (activePwaId) localStorage.setItem(ACTIVE_KEY, activePwaId);
            else localStorage.removeItem(ACTIVE_KEY);
        }

        // ================================================================
        //  CONSTRUCTION DES ONGLETS
        // ================================================================
        function buildTabs() {
            const tabs = document.getElementById('tabs-container');
            tabs.innerHTML = '';

            pwaList.forEach(pwa => {
                const socket = document.createElement('div');
                socket.className = 'btn-socket';
                socket.id = `btn-${pwa.id}`;
                socket.dataset.id = pwa.id;

                const led = document.createElement('div');
                led.className = 'led';
                socket.appendChild(led);

                const btn = document.createElement('button');
                btn.className = 'pwa-btn';
                btn.textContent = pwa.name;
                socket.appendChild(btn);

                socket.addEventListener('mouseenter', () => {
                    if (socket.classList.contains('active')) return;
                    socket.style.borderColor = pwa.colorDim;
                    socket.style.boxShadow = `0 6px 20px rgba(0, 0, 0, 0.3), 0 0 12px ${pwa.colorBgSoft}`;
                });
                socket.addEventListener('mouseleave', () => {
                    if (socket.classList.contains('active')) return;
                    socket.style.borderColor = '';
                    socket.style.boxShadow = '';
                });

                socket.addEventListener('click', () => {
                    socket.classList.add('tapping');
                    setTimeout(() => socket.classList.remove('tapping'), 260);

                    const isClosing = activePwaId === pwa.id;
                    if (isClosing) {
                        vibrate([8, 30, 8]);
                        playCloseSound();
                    } else {
                        vibrate(15);
                        playOpenSound();
                    }

                    togglePwa(pwa.id);
                });

                tabs.appendChild(socket);
            });
        }

        // ================================================================
        //  CRÉATION D'UNE CARTE
        // ================================================================
        function createCard(pwa) {
            const container = document.getElementById('cards-container');

            const card = document.createElement('div');
            card.className = 'pwa-single hidden-card';
            card.id = `card-${pwa.id}`;
            card.style.borderColor = pwa.colorDim;

            const header = document.createElement('div');
            header.className = 'pwa-card-header';
            header.innerHTML = `
                <span class="pwa-card-title" style="color:${pwa.color};">
                    <span class="dot" style="background:${pwa.color}; box-shadow: 0 0 10px ${pwa.color};"></span>
                    ${pwa.name}
                    <span class="pwa-card-url">${pwa.url}</span>
                </span>
                <button class="pwa-card-reload" title="Recharger">⟳</button>
            `;
            header.querySelector('.pwa-card-reload').addEventListener('click', (e) => {
                e.stopPropagation();
                vibrate(10);
                playClickSound();
                const iframe = card.querySelector('iframe');
                if (iframe) {
                    const loader = card.querySelector('.pwa-loader');
                    if (loader) loader.classList.remove('hidden');
                    iframe.src = iframe.src;
                }
            });

            const body = document.createElement('div');
            body.className = 'pwa-card-body';

            const loader = document.createElement('div');
            loader.className = 'pwa-loader';
            loader.style.color = pwa.color;
            loader.innerHTML = `
                <div class="spinner" style="border-color:${pwa.colorBg}; border-top-color:${pwa.color};"></div>
                <div>Chargement…</div>
            `;
            body.appendChild(loader);

            const iframe = document.createElement('iframe');
            iframe.id = `iframe-${pwa.id}`;
            iframe.src = pwa.url;
            iframe.setAttribute('scrolling', 'auto');
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-modals allow-popups');
            iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');

            let loaded = false;
            iframe.addEventListener('load', () => {
                loaded = true;
                loader.classList.add('hidden');
            });

            const timeoutId = setTimeout(() => {
                if (!loaded) showError(body, pwa);
            }, 12000);

            iframe.addEventListener('error', () => {
                clearTimeout(timeoutId);
                showError(body, pwa);
            });

            body.appendChild(iframe);
            card.appendChild(header);
            card.appendChild(body);
            container.appendChild(card);
        }

        function showError(container, pwa) {
            if (container.querySelector('.pwa-error')) return;
            const loader = container.querySelector('.pwa-loader');
            if (loader) loader.classList.add('hidden');
            const iframe = container.querySelector('iframe');
            if (iframe) iframe.style.visibility = 'hidden';

            const err = document.createElement('div');
            err.className = 'pwa-error';
            err.innerHTML = `
                <div class="err-icon">⚠️</div>
                <div class="err-title">Page introuvable</div>
                <div class="err-msg">
                    Cette URL ne répond pas. Vérifie que le dépôt GitHub Pages existe et contient un <b>index.html</b>.
                </div>
                <div class="err-url">${pwa.url}</div>
                <button class="err-btn" style="background:${pwa.colorBg}; border-color:${pwa.colorDim}; color:${pwa.color};">Réessayer</button>
            `;
            err.querySelector('.err-btn').addEventListener('click', () => {
                err.remove();
                if (iframe) {
                    iframe.style.visibility = 'visible';
                    iframe.src = iframe.src;
                }
                if (loader) loader.classList.remove('hidden');
            });
            container.appendChild(err);
        }

        // ================================================================
        //  VISIBILITÉ
        // ================================================================
        function updateVisibility() {
            const welcome = document.getElementById('welcome');

            // Cartes : visible ou none (pas de superposition résiduelle)
            pwaList.forEach(pwa => {
                const card = document.getElementById(`card-${pwa.id}`);
                if (!card) return;
                if (pwa.id === activePwaId) {
                    card.classList.add('visible');
                    card.classList.remove('hidden-card');
                } else {
                    card.classList.remove('visible');
                    card.classList.add('hidden-card');
                }
            });

            // Écran d'accueil : visible UNIQUEMENT si aucun onglet actif
            if (activePwaId) {
                welcome.classList.remove('visible');
            } else {
                welcome.classList.add('visible');
            }

            // Onglets
            pwaList.forEach(pwa => {
                const socket = document.getElementById(`btn-${pwa.id}`);
                if (!socket) return;
                const isActive = pwa.id === activePwaId;
                const led = socket.querySelector('.led');
                const btn = socket.querySelector('.pwa-btn');

                if (isActive) {
                    socket.classList.add('active');
                    socket.style.background = pwa.colorBg;
                    socket.style.borderColor = pwa.colorDim;
                    socket.style.boxShadow = `0 0 24px ${pwa.colorBgSoft}, inset 0 0 24px ${pwa.colorBgSoft}`;
                    led.style.background = pwa.color;
                    led.style.boxShadow = `0 0 14px ${pwa.color}`;
                    btn.style.color = pwa.color;
                } else {
                    socket.classList.remove('active');
                    socket.style.background = '';
                    socket.style.borderColor = '';
                    socket.style.boxShadow = '';
                    led.style.background = '#3c465a';
                    led.style.boxShadow = 'inset 0 1px 2px rgba(0, 0, 0, 0.6)';
                    btn.style.color = '#94a0b8';
                }
            });
        }

        // ================================================================
        //  TOGGLE PWA
        // ================================================================
        function togglePwa(id) {
            if (activePwaId === id) {
                activePwaId = null;
            } else {
                if (!loadedPwas.has(id)) {
                    const pwa = pwaList.find(p => p.id === id);
                    if (pwa) {
                        createCard(pwa);
                        loadedPwas.add(id);
                    }
                }
                activePwaId = id;
            }
            saveActive();
            updateVisibility();
        }

        // ================================================================
        //  POSTMESSAGE
        // ================================================================
        window.addEventListener('message', (event) => {
            const msg = event.data;
            if (msg?.type === 'HUB_ROUTER' && msg.target) {
                const iframe = document.getElementById(`iframe-${msg.target}`);
                if (iframe) iframe.contentWindow.postMessage(msg.payload, '*');
            }
        });

        // ================================================================
        //  SERVICE WORKER CLEANUP
        // ================================================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
        }

        // ================================================================
        //  INIT
        // ================================================================
        activePwaId = null;
        buildTabs();
        updateVisibility();
    </script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
</html>
